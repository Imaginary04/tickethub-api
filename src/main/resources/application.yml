spring:
  application:
    name: tickethub-api

  datasource:
    url: jdbc:postgresql://localhost:5432/tickethub
    username: tickethub
    password: tickethub

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway creates tables; Hibernate only checks them
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always